name: signal-desk-stock-research
description: Evidence-grounded stock research using Massive, Lakebase, and semantic context.
contract_version: "1.0"
system_prompt_file: system_prompt.md
supervisor:
  display_name: Signal Desk Stock Research
  description: Routes evidence-grounded market research and confirmed user-owned research actions to Signal Desk.
  instructions_file: system_prompt.md
external_mcp_connection:
  tool_name: stock_market_research
  connection_name: bootcamp_students.student_sri.signal_desk_mcp_connection
  mcp_service_name: bootcamp_students.student_sri.signal_desk_mcp
  tool_type: uc_mcp
  description: Retrieves governed market and filing evidence and performs explicitly confirmed user-owned watchlist, note, and report actions.
  endpoint: https://signal-desk-mcp.onrender.com/mcp
  transport: streamable-http
  health_endpoint: https://signal-desk-mcp.onrender.com/health
  tools:
    - get_stock_performance
    - get_company_research
    - compare_stocks
    - get_watchlist
    - update_watchlist
    - save_research_note
    - save_analysis_report
    - semantic_research
    - get_notable_updates
evaluation:
  fixture_file: evaluations.json
  evaluator: ../tools/phase7_agent_eval.py
  capture: ../tools/phase7_live_capture.py
  results_file: ../build/acceptance/p5-supervisor-results.json
deployment:
  supervisor_resource: supervisor-agents/cb6be7ba-3357-48b4-9cf6-2849157d82f0
  serving_endpoint: mas-cb6be7ba-endpoint
  experiment_id: "2541423914265277"
guardrails:
  - Never state market facts without a successful tool result.
  - Never silently treat missing or plan-restricted fundamentals as zero.
  - Always state source, ticker, lookback, and as-of date for price claims.
  - Mutate watchlists or save research only on explicit user request.
  - Separate factual evidence from interpretation and avoid guarantees.
  - Keep get_notable_updates mark_visited false unless the user explicitly asks to advance it.
