bundle:
  name: signal-desk-capstone

include:
  - resources/*.job.yml
  - resources/*.pipeline.yml
  - resources/storage.yml
  - resources/research_search.yml

variables:
  catalog:
    description: Unity Catalog catalog for Signal Desk datasets
  schema:
    description: Unity Catalog schema for Signal Desk datasets
  raw_volume:
    description: Managed volume used for immutable API landing files
    default: signal_desk_raw
  warehouse_id:
    description: SQL warehouse ID used by the frontend for analytics
  lakebase_table_suffix:
    description: Per-student suffix on shared Lakebase source tables
  pipeline_development:
    description: Whether the Lakeflow pipeline uses development mode
    default: true

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: bootcamp_students
      schema: student_sri
      warehouse_id: b15d3d6f837ba428
      lakebase_table_suffix: srini

  prod:
    mode: production
    variables:
      pipeline_development: false
