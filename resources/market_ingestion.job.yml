resources:
  jobs:
    market_ingestion:
      name: signal-desk-market-ingestion-${bundle.target}
      description: Lands rate-limited Massive grouped daily responses in the raw volume
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: ${var.raw_volume}
      tasks:
        - task_key: grouped_daily_landing
          spark_python_task:
            python_file: ../ingestion/market_backfill.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --schema
              - "{{job.parameters.schema}}"
              - --volume
              - "{{job.parameters.volume}}"
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 60000
      permissions:
        - level: CAN_VIEW
          group_name: users

    research_embeddings:
      name: signal-desk-research-embeddings-${bundle.target}
      description: Existing embedding workload, scheduled and dependency wiring added in Phase 5
      max_concurrent_runs: 1
      tasks:
        - task_key: embed_research_content
          spark_python_task:
            python_file: ../jobs/ingest_research_embeddings.py
            parameters:
              - --batch-size
              - "100"
          timeout_seconds: 3600
          max_retries: 1
      permissions:
        - level: CAN_VIEW
          group_name: users
