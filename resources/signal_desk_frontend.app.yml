resources:
  apps:
    signal_desk_frontend:
      name: signal-desk-frontend-${bundle.target}
      description: Signal Desk Flask research workflow
      source_code_path: ../dashboard
      resources:
        - name: lakebase-url
          description: Admin-managed Lakebase PostgreSQL connection URL
          secret:
            scope: database
            key: lakebase-url
            permission: READ
        - name: sql-warehouse
          description: Serverless SQL warehouse for governed analytics queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
