resources:
  vector_search_endpoints:
    research_search:
      name: signal-desk-research-${bundle.target}
      endpoint_type: STANDARD
      permissions:
        - level: CAN_USE
          group_name: users

  vector_search_indexes:
    research_chunks:
      name: ${var.catalog}.${var.schema}.signal_desk_research_chunks_index
      endpoint_name: ${resources.vector_search_endpoints.research_search.name}
      index_type: DELTA_SYNC
      index_subtype: HYBRID
      primary_key: chunk_id
      delta_sync_index_spec:
        source_table: ${var.catalog}.${var.schema}.research_search_documents
        pipeline_type: TRIGGERED
        embedding_source_columns:
          - name: chunk_to_embed
            embedding_model_endpoint_name: databricks-qwen3-embedding-0-6b
            model_endpoint_name_for_query: databricks-qwen3-embedding-0-6b
