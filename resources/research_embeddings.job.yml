resources:
  jobs:
    research_embeddings:
      name: signal-desk-research-search-sync-${bundle.target}
      description: Trigger the managed Delta Sync AI Search index after research-pipeline updates
      max_concurrent_runs: 1
      environments:
        - environment_key: embeddings
          spec:
            client: "4"
            dependencies:
              - databricks-sdk>=0.81,<1
      tasks:
        - task_key: sync_research_index
          environment_key: embeddings
          spark_python_task:
            python_file: ../jobs/ingest_research_embeddings.py
            parameters:
              - --index-name
              - ${resources.vector_search_indexes.research_chunks.name}
          timeout_seconds: 3600
          max_retries: 1
      permissions:
        - level: CAN_VIEW
          group_name: users
