resources:
  pipelines:
    research_pipeline:
      name: signal-desk-research-pipeline-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      development: ${var.pipeline_development}
      continuous: false
      photon: true
      channel: current
      root_path: ../pipelines
      libraries:
        - glob:
            include: ../pipelines/**
      configuration:
        signal_desk.raw_volume_path: /Volumes/${var.catalog}/${var.schema}/${var.raw_volume}
      permissions:
        - level: CAN_VIEW
          group_name: users
