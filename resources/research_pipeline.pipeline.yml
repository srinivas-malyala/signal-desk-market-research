resources:
  pipelines:
    research_pipeline:
      name: signal-desk-research-pipeline-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      development: ${var.pipeline_development}
      continuous: false
      photon: true
      channel: current
      root_path: ../pipelines
      libraries:
        - glob:
            include: ../pipelines/_article_pipeline_common.py
        - glob:
            include: ../pipelines/_sec_pipeline_common.py
        - glob:
            include: ../pipelines/document_text.py
        - glob:
            include: ../pipelines/bronze_research_*.py
        - glob:
            include: ../pipelines/bronze_sec_*.py
        - glob:
            include: ../pipelines/silver_article_*.py
        - glob:
            include: ../pipelines/silver_research_*.py
        - glob:
            include: ../pipelines/silver_sec_*.py
        - glob:
            include: ../pipelines/sec_structured_reconciliation.py
        - glob:
            include: ../pipelines/research_chunk_reconciliation.py
        - glob:
            include: ../pipelines/gold_industry_peer_comparison.py
        - glob:
            include: ../pipelines/gold_research_*.py
      configuration:
        signal_desk.raw_volume_path: /Volumes/${var.catalog}/${var.schema}/${var.raw_volume}
      permissions:
        - level: CAN_VIEW
          group_name: users
