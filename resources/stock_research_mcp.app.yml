resources:
  apps:
    stock_research_mcp:
      name: signal-desk-mcp-${bundle.target}
      description: Signal Desk FastMCP retrieval and action service
      source_code_path: ../mcp_server
      resources:
        - name: massive-api-key
          description: Admin-managed Massive free-plan API key
          secret:
            scope: massive
            key: api-key
            permission: READ
        - name: lakebase-url
          description: Admin-managed Lakebase PostgreSQL connection URL
          secret:
            scope: database
            key: lakebase-url
            permission: READ
        - name: sql-warehouse
          description: Serverless SQL warehouse for bounded agent analytics queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: silver-market-bars
          description: Governed historical OHLCV used by retrieval tools
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.silver_market_bars
            permission: SELECT
        - name: gold-stock-performance
          description: Governed daily performance metrics used by retrieval tools
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.gold_stock_performance
            permission: SELECT
        - name: research-index
          description: Managed hybrid AI Search index for filing and article retrieval
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${resources.vector_search_indexes.research_chunks.name}
            permission: SELECT
