resources:
  apps:
    stock_research_mcp:
      name: signal-desk-mcp-${bundle.target}
      description: Signal Desk FastMCP retrieval and action service
      source_code_path: ../mcp_server
      resources:
        - name: lakebase-url
          description: Admin-managed Lakebase PostgreSQL connection URL
          secret:
            scope: database
            key: lakebase-url
            permission: READ
        - name: sql-warehouse
          description: Serverless SQL warehouse for bounded agent analytics queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
