<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Signal Desk capstone architecture</title>
  <desc id="desc">Architecture showing Massive and SEC data flowing through a PySpark medallion pipeline, operational data in Lakebase, an MCP action agent, Lakebase change data feed analytics, and a Databricks App frontend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 19px Arial,sans-serif;fill:#475569}.zone{font:700 18px Arial,sans-serif;letter-spacing:1px;fill:#334155}.box-title{font:700 20px Arial,sans-serif;fill:#0f172a}.box-text{font:400 15px Arial,sans-serif;fill:#334155}.small{font:400 13px Arial,sans-serif;fill:#475569}.label{font:700 13px Arial,sans-serif;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.blue-line{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.dash{stroke-dasharray:9 7}.box{rx:18;filter:url(#shadow);stroke-width:2}.source{fill:#fff7ed;stroke:#fb923c}.spark{fill:#eff6ff;stroke:#3b82f6}.delta{fill:#ecfeff;stroke:#06b6d4}.lake{fill:#f0fdf4;stroke:#22c55e}.agent{fill:#faf5ff;stroke:#a855f7}.app{fill:#fff1f2;stroke:#f43f5e}.analytics{fill:#fefce8;stroke:#eab308}.zone-bg{fill:#ffffff;fill-opacity:.55;stroke:#cbd5e1;stroke-width:1.5;rx:24}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="70" y="64" class="title">Signal Desk — Agentic Market Research</text>
  <text x="70" y="98" class="subtitle">Spark market pipeline + Lakebase operations + action-taking AI + CDC usage analytics</text>

  <rect x="50" y="135" width="330" height="905" class="zone-bg"/>
  <rect x="405" y="135" width="520" height="905" class="zone-bg"/>
  <rect x="950" y="135" width="450" height="905" class="zone-bg"/>
  <rect x="1425" y="135" width="325" height="905" class="zone-bg"/>
  <text x="75" y="175" class="zone">DATA SOURCES</text>
  <text x="430" y="175" class="zone">LAKEHOUSE / SPARK</text>
  <text x="975" y="175" class="zone">OPERATIONAL + AI</text>
  <text x="1450" y="175" class="zone">EXPERIENCE</text>

  <rect x="80" y="220" width="270" height="155" class="box source"/>
  <text x="105" y="255" class="box-title">Massive Stocks API</text>
  <text x="105" y="285" class="box-text">• Daily market summary</text>
  <text x="105" y="310" class="box-text">• Bars, daily close, profiles</text>
  <text x="105" y="335" class="box-text">• News + sentiment JSON</text>
  <text x="105" y="360" class="small">Free: 5 calls/min • 2 years EOD</text>

  <rect x="80" y="425" width="270" height="150" class="box source"/>
  <text x="105" y="460" class="box-title">SEC EDGAR APIs</text>
  <text x="105" y="490" class="box-text">• Submissions + XBRL facts</text>
  <text x="105" y="515" class="box-text">• 10-K / 10-Q / 8-K text</text>
  <text x="105" y="540" class="small">Authoritative filings</text>

  <rect x="435" y="210" width="460" height="120" class="box spark"/>
  <text x="465" y="250" class="box-title">Lakeflow Job — PySpark ingestion</text>
  <text x="465" y="280" class="box-text">Scheduled API pulls, pagination, retries, raw landing</text>
  <text x="465" y="305" class="small">Shared limiter: 4 calls/min • date checkpoints</text>

  <rect x="435" y="380" width="460" height="125" class="box delta"/>
  <text x="465" y="420" class="box-title">Bronze Delta + UC Volume</text>
  <text x="465" y="450" class="box-text">Raw market, company, news, XBRL, filing documents</text>
  <text x="465" y="478" class="small">Source payloads and provenance retained</text>

  <rect x="435" y="555" width="460" height="145" class="box spark"/>
  <text x="465" y="595" class="box-title">Lakeflow Spark Declarative Pipeline</text>
  <text x="465" y="625" class="box-text">Clean • deduplicate • validate • enrich • parse text</text>
  <text x="465" y="653" class="box-text">Streaming tables + expectations + materialized views</text>
  <text x="465" y="680" class="small">Silver: bars, news, facts, filings, research chunks</text>

  <rect x="435" y="750" width="460" height="125" class="box delta"/>
  <text x="465" y="790" class="box-title">Gold Delta + managed AI Search</text>
  <text x="465" y="820" class="box-text">Performance • peer metrics • research catalog</text>
  <text x="465" y="848" class="small">Qwen3 Delta Sync hybrid index • quality metrics</text>

  <rect x="435" y="925" width="460" height="85" class="box analytics"/>
  <text x="465" y="960" class="box-title">SQL Warehouse</text>
  <text x="465" y="988" class="box-text">Analytical queries for app and agent</text>

  <rect x="980" y="210" width="390" height="210" class="box lake"/>
  <text x="1010" y="250" class="box-title">Lakebase Postgres Autoscaling</text>
  <text x="1010" y="282" class="box-text">Users • watchlists • notes • reports</text>
  <text x="1010" y="310" class="box-text">Sessions • tool events • recent cache</text>
  <text x="1010" y="338" class="box-text">Idempotency • confirmed write state</text>
  <text x="1010" y="372" class="small">Low-latency operational state</text>
  <text x="1010" y="397" class="small">Shared schema • owned _srini tables</text>

  <rect x="980" y="485" width="390" height="140" class="box agent"/>
  <text x="1010" y="525" class="box-title">FastMCP research tools</text>
  <text x="1010" y="555" class="box-text">Retrieve prices, companies, evidence, watchlists</text>
  <text x="1010" y="583" class="box-text">Write watchlists, notes, and reports</text>
  <text x="1010" y="607" class="small">Sanitized trace on every tool call</text>

  <rect x="980" y="690" width="390" height="120" class="box agent"/>
  <text x="1010" y="730" class="box-title">Agent Bricks Supervisor</text>
  <text x="1010" y="760" class="box-text">Grounded orchestration + confirmation before writes</text>
  <text x="1010" y="786" class="small">External MCP tool connection</text>

  <rect x="980" y="865" width="390" height="145" class="box analytics"/>
  <text x="1010" y="905" class="box-title">Lakebase CDF → Delta</text>
  <text x="1010" y="935" class="box-text">Insert / update / delete history (~15 seconds)</text>
  <text x="1010" y="963" class="box-text">Agent and application change history</text>
  <text x="1010" y="990" class="small">Feeds Lakeflow gold usage metrics</text>

  <rect x="1455" y="275" width="265" height="270" class="box app"/>
  <text x="1485" y="317" class="box-title">Databricks App</text>
  <text x="1485" y="350" class="box-text">Research / chat</text>
  <text x="1485" y="378" class="box-text">Watchlists</text>
  <text x="1485" y="406" class="box-text">Company + peer views</text>
  <text x="1485" y="434" class="box-text">Evidence + sources</text>
  <text x="1485" y="462" class="box-text">Notes + reports</text>
  <text x="1485" y="490" class="box-text">Usage analytics</text>
  <text x="1485" y="522" class="small">Authenticated user workflow</text>

  <rect x="1455" y="660" width="265" height="100" class="box app"/>
  <text x="1485" y="700" class="box-title">Researcher</text>
  <text x="1485" y="730" class="box-text">Ask • inspect • act • save</text>

  <path d="M350 290 C385 290 395 270 435 270" class="line"/>
  <path d="M350 500 C390 500 395 300 435 290" class="line"/>
  <path d="M665 330 L665 380" class="blue-line"/>
  <path d="M665 505 L665 555" class="blue-line"/>
  <path d="M665 700 L665 750" class="blue-line"/>
  <path d="M665 875 L665 925" class="blue-line"/>
  <path d="M895 980 L930 1030 L1435 1030 L1435 515 L1455 515" class="line"/>
  <path d="M1587 660 L1587 545" class="blue-line"/>
  <path d="M1455 410 C1410 410 1410 750 1370 750" class="line"/>
  <path d="M1370 725 C1415 725 1415 455 1455 455" class="blue-line"/>
  <path d="M1175 690 L1175 625" class="blue-line"/>
  <path d="M1175 485 L1175 420" class="blue-line"/>
  <path d="M980 555 C930 555 925 295 350 295" class="line dash"/>
  <path d="M980 570 C930 570 925 812 895 812" class="line"/>
  <path d="M1175 420 L1175 485" class="blue-line"/>
  <path d="M1350 420 C1390 570 1390 760 1350 865" class="line"/>
  <path d="M980 930 C930 930 930 630 895 630" class="line dash"/>

  <text x="366" y="251" class="label">batch APIs</text>
  <text x="711" y="363" class="label">raw</text>
  <text x="711" y="538" class="label">validate</text>
  <text x="711" y="734" class="label">aggregate</text>
  <text x="1200" y="456" class="label">CRUD</text>
  <text x="1200" y="660" class="label">tools</text>
  <text x="1200" y="845" class="label">change events</text>
  <text x="1385" y="710" class="label">agent answer</text>
  <text x="1520" y="625" class="label">research request</text>
  <text x="1305" y="1018" class="label">analytics</text>
  <text x="870" y="545" class="label">on-demand API calls</text>

  <text x="70" y="1080" class="subtitle">Two required Vs: Volume (&gt;1M market rows) + Variety (structured, JSON, and unstructured text) • Optional Velocity: Lakebase changes to analytics in &lt;1 minute</text>
</svg>
